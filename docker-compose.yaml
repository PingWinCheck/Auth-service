  db-test:
    container_name: db-test
    image: postgres:latest
    ports:
      - "5433:5432"
    environment:
      POSTGRES_PASSWORD: ${DB_TEST__PASSWORD}
      POSTGRES_USER: ${DB_TEST__USER}
      POSTGRES_DB: ${DB_TEST__NAME}
    profiles:
      - dev

  redis:
    container_name: redis
    image: redis:latest
    ports:
      - "6379:6379"

