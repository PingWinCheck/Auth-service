[project]
name = "auth-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.12.0",
    "alembic>=1.15.1",
    "asyncpg>=0.30.0",
    "beanie>=1.29.0",
    "email-validator>=2.2.0",
    "fastapi>=0.115.11",
    "fastapi-users[sqlalchemy]>=14.0.1",
    "faststream[rabbit]>=0.6.5",
    "pydantic-settings>=2.8.1",
    "redis>=6.0.0",
    "sqlalchemy[asyncio]>=2.0.39",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "faker>=37.1.0",
    "freezegun>=1.5.1",
    "httpx>=0.28.1",
    "pre-commit>=4.1.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.11.0",
]

[tool.ruff]
exclude = ["env.py", "volume"]

[tool.pytest.ini_options]
addopts = "--ignore=volume"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
